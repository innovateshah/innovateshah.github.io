<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MathQuill Editor</title>

    <!-- Stylesheet from the same MathQuill package that main.js imports -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@desmos-community/mathquill@2026.8.7/dist/style.css">

    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        #math-field { min-width: 300px; padding: 6px; font-size: 1.4em; }
        #latex-output { width: 300px; font-family: monospace; }
        canvas { border: 1px solid #999; display: block; margin-top: 1rem; }
        .row { margin: 0.75rem 0; }
        #plot-error { color: #b00020; }
    </style>
</head>
<body>

    <h2>MathQuill Editor</h2>

    <!-- 1. MathQuill editor -->
    <div class="row">
        <span id="math-field"></span>
    </div>

    <!-- 2. Line edit showing the raw LaTeX -->
    <div class="row">
        <label for="latex-output">Raw LaTeX:</label><br>
        <input type="text" id="latex-output" readonly>
    </div>

    <div class="row">
        <label for="lineWidth-field">Line width:</label>
        <input type="number" id="lineWidth-field" min="0" step="any" value="5" placeholder="Enter a positive number">
    </div>
    <div class="row">
        <input type="number" id="lineRed-field"   min="0" max="255" step="1" value="0" placeholder="R">
        <input type="number" id="lineGreen-field" min="0" max="255" step="1" value="0" placeholder="G">
        <input type="number" id="lineBlue-field"  min="0" max="255" step="1" value="0" placeholder="B">
    </div>

    <!-- 4. Plot button -->
    <button id="plot-button">Plot!</button>
    <span id="plot-error"></span>

    <!-- 3. Canvas for the plot -->
    <canvas id="01-plot" width="300" height="300"></canvas>

    <script type="module" src="js/main.js"></script>

</body>
</html>
